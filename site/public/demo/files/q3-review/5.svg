<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica Neue, Arial, sans-serif"><rect width="1600" height="900" fill="#FBF7F2"/><text x="110" y="96" font-size="16" font-weight="600" fill="#B9A99C" letter-spacing="2.5">LARKSPUR COFFEE ROASTERS  ·  Q3 2026 BUSINESS REVIEW</text><g transform="translate(1474 88) rotate(-28) scale(0.9)"><ellipse rx="16" ry="22" fill="#C2552B"/><path d="M1 -19 C 9 -7, -7 7, 1 19" stroke="#FBF7F2" stroke-width="3" fill="none" stroke-linecap="round"/></g><text x="110" y="190" font-size="52" font-weight="700" fill="#2B1D16">Wholesale up 24%, led by 18 new cafés</text><text x="110" y="300" font-size="24" font-weight="600" fill="#8A776A">New café partners by region</text><text x="110" y="382" font-size="26" font-weight="600" fill="#2B1D16">Portland</text><rect x="270" y="356" width="496" height="38" rx="8" fill="#C2552B"/><text x="782" y="384" font-size="24" font-weight="700" fill="#2B1D16">8</text><text x="110" y="462" font-size="26" font-weight="600" fill="#2B1D16">Seattle</text><rect x="270" y="436" width="310" height="38" rx="8" fill="#E2AE62"/><text x="596" y="464" font-size="24" font-weight="700" fill="#2B1D16">5</text><text x="110" y="542" font-size="26" font-weight="600" fill="#2B1D16">Bay Area</text><rect x="270" y="516" width="186" height="38" rx="8" fill="#E2AE62"/><text x="472" y="544" font-size="24" font-weight="700" fill="#2B1D16">3</text><text x="110" y="622" font-size="26" font-weight="600" fill="#2B1D16">Boise</text><rect x="270" y="596" width="124" height="38" rx="8" fill="#E2AE62"/><text x="410" y="624" font-size="24" font-weight="700" fill="#2B1D16">2</text><rect x="900" y="280" width="590" height="330" rx="18" fill="#2B1D16"/><text x="940" y="370" font-size="30" font-weight="600" fill="#FBF7F2">“Our customers ask for the Guji</text><text x="940" y="414" font-size="30" font-weight="600" fill="#FBF7F2">by name now. It sold out in our</text><text x="940" y="458" font-size="30" font-weight="600" fill="#FBF7F2">shop before it did online.”</text><rect x="940" y="500" width="48" height="4" rx="2" fill="#C2552B"/><text x="940" y="548" font-size="20" font-weight="400" fill="#CDB9A8">Maya Ortiz, owner, Fernwood Café, Portland</text><text x="110" y="728" font-size="46" font-weight="800" fill="#C2552B">62</text><text x="110" y="766" font-size="22" font-weight="400" fill="#8A776A">wholesale accounts</text><text x="580" y="728" font-size="46" font-weight="800" fill="#C2552B">$1.1M</text><text x="580" y="766" font-size="22" font-weight="400" fill="#8A776A">wholesale revenue in Q3</text><text x="1050" y="728" font-size="46" font-weight="800" fill="#C2552B">96%</text><text x="1050" y="766" font-size="22" font-weight="400" fill="#8A776A">of cafés reordered</text><line x1="110" y1="830" x2="1490" y2="830" stroke="#E8DED4" stroke-width="2"/><text x="110" y="866" font-size="16" font-weight="400" fill="#B9A99C">Internal  ·  Leadership team</text><text x="1490" y="866" font-size="18" font-weight="600" fill="#8A776A" text-anchor="end">5</text></svg>
