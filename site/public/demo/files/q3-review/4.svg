<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica Neue, Arial, sans-serif"><rect width="1600" height="900" fill="#FBF7F2"/><text x="110" y="96" font-size="16" font-weight="600" fill="#B9A99C" letter-spacing="2.5">LARKSPUR COFFEE ROASTERS  ·  Q3 2026 BUSINESS REVIEW</text><g transform="translate(1474 88) rotate(-28) scale(0.9)"><ellipse rx="16" ry="22" fill="#C2552B"/><path d="M1 -19 C 9 -7, -7 7, 1 19" stroke="#FBF7F2" stroke-width="3" fill="none" stroke-linecap="round"/></g><text x="110" y="190" font-size="52" font-weight="700" fill="#2B1D16">Subscription churn fell to 3.1%</text><text x="110" y="238" font-size="22" font-weight="400" fill="#8A776A">Monthly churn: the share of active subscribers who cancelled</text><line x1="130" y1="700" x2="900" y2="700" stroke="#E8DED4" stroke-width="2"/><line x1="130" y1="610" x2="900" y2="610" stroke="#E8DED4" stroke-width="1"/><line x1="130" y1="520" x2="900" y2="520" stroke="#E8DED4" stroke-width="1"/><line x1="130" y1="430" x2="900" y2="430" stroke="#E8DED4" stroke-width="1"/><rect x="150" y="406" width="78" height="294" rx="6" fill="#D8C8BA"/><text x="189" y="392" font-size="22" font-weight="700" fill="#8A776A" text-anchor="middle">4.9%</text><text x="189" y="734" font-size="20" font-weight="400" fill="#8A776A" text-anchor="middle">Apr</text><rect x="275" y="424" width="78" height="276" rx="6" fill="#D8C8BA"/><text x="314" y="410" font-size="22" font-weight="700" fill="#8A776A" text-anchor="middle">4.6%</text><text x="314" y="734" font-size="20" font-weight="400" fill="#8A776A" text-anchor="middle">May</text><rect x="400" y="424" width="78" height="276" rx="6" fill="#D8C8BA"/><text x="439" y="410" font-size="22" font-weight="700" fill="#8A776A" text-anchor="middle">4.6%</text><text x="439" y="734" font-size="20" font-weight="400" fill="#8A776A" text-anchor="middle">Jun</text><rect x="525" y="460" width="78" height="240" rx="6" fill="#C2552B"/><text x="564" y="446" font-size="22" font-weight="700" fill="#2B1D16" text-anchor="middle">4.0%</text><text x="564" y="734" font-size="20" font-weight="400" fill="#8A776A" text-anchor="middle">Jul</text><rect x="650" y="490" width="78" height="210" rx="6" fill="#C2552B"/><text x="689" y="476" font-size="22" font-weight="700" fill="#2B1D16" text-anchor="middle">3.5%</text><text x="689" y="734" font-size="20" font-weight="400" fill="#8A776A" text-anchor="middle">Aug</text><rect x="775" y="514" width="78" height="186" rx="6" fill="#C2552B"/><text x="814" y="500" font-size="22" font-weight="700" fill="#2B1D16" text-anchor="middle">3.1%</text><text x="814" y="734" font-size="20" font-weight="400" fill="#8A776A" text-anchor="middle">Sep</text><line x1="508" y1="300" x2="508" y2="700" stroke="#C2552B" stroke-width="2" stroke-dasharray="6 6"/><text x="522" y="318" font-size="18" font-weight="600" fill="#C2552B">Changes shipped July 1</text><rect x="980" y="290" width="510" height="400" rx="18" fill="#FFFFFF" stroke="#EDE3D9" stroke-width="2"/><text x="1016" y="346" font-size="28" font-weight="700" fill="#2B1D16">What changed</text><rect x="1016" y="402" width="12" height="12" rx="3" fill="#C2552B"/><text x="1044" y="414" font-size="23" font-weight="700" fill="#2B1D16">Pause instead of cancel</text><text x="1044" y="446" font-size="20" font-weight="400" fill="#8A776A">1 in 3 who start to cancel now pause</text><rect x="1016" y="494" width="12" height="12" rx="3" fill="#C2552B"/><text x="1044" y="506" font-size="23" font-weight="700" fill="#2B1D16">Flexible delivery</text><text x="1044" y="538" font-size="20" font-weight="400" fill="#8A776A">Every 2, 3 or 4 weeks, changed any time</text><rect x="1016" y="586" width="12" height="12" rx="3" fill="#C2552B"/><text x="1044" y="598" font-size="23" font-weight="700" fill="#2B1D16">Roaster’s choice box</text><text x="1044" y="630" font-size="20" font-weight="400" fill="#8A776A">Re-launched in July: 4,100 subscribers</text><rect x="980" y="712" width="510" height="92" rx="14" fill="#F4E7DB"/><text x="1010" y="750" font-size="21" font-weight="600" fill="#2B1D16">Every point of churn we cut is worth</text><text x="1010" y="780" font-size="21" font-weight="600" fill="#C2552B">about $310K a year in revenue</text><line x1="110" y1="830" x2="1490" y2="830" stroke="#E8DED4" stroke-width="2"/><text x="110" y="866" font-size="16" font-weight="400" fill="#B9A99C">Internal  ·  Leadership team</text><text x="1490" y="866" font-size="18" font-weight="600" fill="#8A776A" text-anchor="end">4</text></svg>
