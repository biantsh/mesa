[package]
name = "mesa-ocr"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Text recognition for Mesa's index."

[dependencies]
fast_image_resize = "5"
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-native", "api-31", "coreml"] }
[target.'cfg(not(target_os = "macos"))'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-native", "api-31", "copy-dylibs", "webgpu"] }
