[package]
name = "mesa-app"
version = "0.1.0"
edition = "2024"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
png = "0.18"
percent-encoding = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
half = "2"
ureq = "3"
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
crossbeam-channel = "0.5"
notify = "8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
fast_image_resize = "5"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "wav", "ogg", "vorbis", "isomp4", "aac", "pcm", "alac"] }
zip = { version = "9.2.0", default-features = false, features = ["deflate"] }
quick-xml = "0.42.0"
pdf_oxide = { version = "0.3.78", default-features = false, features = ["legacy-crypto"] }
hayro = "0.9"
docxide-pdf = { version = "0.21", default-features = false }

[profile.dev.package."*"]
opt-level = 3

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Data_Pdf",
    "Data_Xml_Dom",
    "Foundation",
    "Foundation_Collections",
    "Storage",
    "Storage_Streams",
    "UI",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "UI_Notifications",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder", "NSPasteboard", "NSPasteboardItem", "NSScreen", "NSEvent"] }
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-image-io = "0.3"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media", "objc2-core-graphics"] }
objc2-core-media = "0.3"
objc2-quick-look-thumbnailing = "0.3"
block2 = "0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
fastrand = "2"
