<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mesa</title>
    <script>
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem("mesa.theme");
        } catch (e) {}
        if (theme !== "dark" && theme !== "light") {
          theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
